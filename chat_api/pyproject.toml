[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-api"
version = "0.1.0"
description = "Анонимная система чатов на FastAPI: long polling, текст, картинки, видео"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "aiosqlite",
    "python-multipart",
    "aiofiles",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools]
packages = ["chat_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]